<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <div class="form-box">

        <h2>Customer Login</h2>


        <form action="/login" method="POST">


            <label>Username</label>

            <input
                type="text"
                name="username"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                required
            >


            <button type="submit">
                Login
            </button>


        </form>


        <p>

            New customer?

            <a href="register.html">
                Register
            </a>

        </p>


    </div>


</body>

</html>
