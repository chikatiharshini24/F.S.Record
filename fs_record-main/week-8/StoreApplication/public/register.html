<!DOCTYPE html>
<html>

<head>

    <title>Registration</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>


    <div class="form-box">

        <h2>Customer Registration</h2>


        <form action="/register" method="POST">


            <label>Name</label>

            <input
                type="text"
                name="name"
                required
            >


            <label>Email</label>

            <input
                type="email"
                name="email"
                required
            >


            <label>Username</label>

            <input
                type="text"
                name="username"
                required
            >


            <label>Password</label>

            <input
                type="password"
                name="password"
                required
            >


            <label>Mobile Number</label>

            <input
                type="text"
                name="mobile"
                required
            >


            <label>Address</label>

            <textarea name="address"></textarea>


            <button type="submit">
                Register
            </button>


        </form>


        <p>
            Already registered?

            <a href="login.html">
                Login
            </a>
        </p>


    </div>


</body>

</html>
